# Publishes tools/arrival-cli to npm as `@arrival-space/cli` when a `cli-v<version>` tag is pushed.
# Auth is npm trusted publishing (GitHub OIDC): no npm token is stored anywhere, and npm attaches
# a provenance attestation linking the release to this workflow run. The trusted publisher on
# npmjs.com names this file — renaming it breaks publishing until that setting is updated.
name: Publish arrival CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/arrival-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "cli-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
